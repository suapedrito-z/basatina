plugins { id 'com.android.application' }

android {
    namespace 'es.pedrito.controlarga'
    compileSdk 34
    defaultConfig {
        applicationId "es.pedrito.controlarga"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }
    buildTypes { release { minifyEnabled false } }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    // Las fotos y mapas ya van comprimidos: no volver a comprimirlos
    androidResources { noCompress 'jpg', 'png' }
}
