plugins { id 'com.android.application' }

android {
    namespace 'es.pedrito.controlarga'
    compileSdk 34
    defaultConfig {
        applicationId "es.pedrito.controlarga"
        minSdk 24
        targetSdk 34
        versionCode 18
        versionName "3.8"
    }
    // Firma fija: así cada versión nueva se instala encima de la anterior sin desinstalar.
    // La contraseña NO está aquí: GitHub la pasa desde el secreto KEYSTORE_PASS del repositorio.
    signingConfigs {
        arga {
            storeFile file('../keystore/arga2.jks')
            storePassword System.getenv('KEYSTORE_PASS') ?: ''
            keyAlias 'arga'
            keyPassword System.getenv('KEYSTORE_PASS') ?: ''
        }
    }
    buildTypes {
        release { minifyEnabled false; signingConfig signingConfigs.arga }
        debug { signingConfig signingConfigs.arga }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    // Las fotos y mapas ya van comprimidos: no volver a comprimirlos
    lint { checkReleaseBuilds false; abortOnError false }
    androidResources { noCompress 'jpg', 'png' }
    // Los archivos de la pantalla (simulador, fotos, mapas) están en la carpeta web/ del repositorio
    sourceSets { main { assets { srcDirs = ['../web'] } } }
}
