name: Agenda de fiestas
on:
  push:
    paths: ['pueblos/*.json', 'tools/agenda.py']
  workflow_dispatch:
permissions:
  contents: write
concurrency: agenda
jobs:
  agenda:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/agenda.py
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add web/agenda.js
          git commit -m "Agenda de fiestas" || exit 0
          git pull --rebase
          python3 tools/make_version.py
          git add web/version.json
          git commit -m "Nueva versión de la pantalla" || true
          for i in 1 2 3 4 5 6; do
            git push && break
            sleep $((i*15))
            git pull --rebase -X theirs || true
            if [ -f tools/make_version.py ]; then python3 tools/make_version.py && git add web/version.json && git commit -m "Nueva versión de la pantalla" || true; fi
          done