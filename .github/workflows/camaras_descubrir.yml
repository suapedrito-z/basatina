name: Cámaras (descubrir)
on:
  push:
    paths: ['tools/camaras_descubrir.py']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  descubrir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/camaras_descubrir.py
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add tools/camaras_info.txt tools/tmp
          git commit -m "Cámaras: prueba de fuentes" || exit 0
          git pull --rebase
          git push
