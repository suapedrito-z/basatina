name: Cámaras (descubrir)
on:
  push:
    paths: ['tools/camaras_descubrir.py']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  descubrir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/camaras_descubrir.py
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add tools/camaras_info.txt
          git commit -m "Cámaras: prueba de fuentes" || exit 0
          git pull --rebase
          for i in 1 2 3 4 5 6; do
            git push && break
            sleep $((i*15))
            git pull --rebase -X theirs || true
            if [ -f tools/make_version.py ]; then python3 tools/make_version.py && git add web/version.json && git commit -m "Nueva versión de la pantalla" || true; fi
          done