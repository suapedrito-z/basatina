# Cuenta y clasifica las rutas a pie de Navarra en OpenStreetMap (tools/rutas.py → rutas/).
# Escribe web/rutas.js (los datos que usa la pantalla Escapadas). Se ejecuta cuando cambia tools/rutas.py o a mano desde Actions.
name: Rutas OSM
on:
  push:
    paths: ['tools/rutas.py', '.github/workflows/rutas.yml']
  workflow_dispatch:
  schedule:
    - cron: '17 4 1 * *'   # el día 1 de cada mes, para recoger las rutas nuevas de OpenStreetMap
permissions:
  contents: write
jobs:
  rutas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Preparar
        run: pip install rasterio numpy
      - name: Descargar y preparar las rutas
        run: python3 tools/rutas.py
      - name: Guardar en el repositorio
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add rutas/ web/rutas.js
          git commit -m "Rutas de Navarra para Escapadas (OSM + IDENA)" || exit 0
          git pull --rebase
          python3 tools/make_version.py
          git add web/version.json
          git commit -m "Nueva versión de la pantalla" || true
          for i in 1 2 3 4 5; do
            git push && break
            sleep $((i*15))
            git pull --rebase -X theirs || true
            python3 tools/make_version.py && git add web/version.json && git commit -m "Nueva versión de la pantalla" || true
          done
