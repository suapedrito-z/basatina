name: Icono de Fauna y flora
on:
  push:
    branches: [main]
    paths: ['.github/workflows/naturaleza-icono.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: instalar-naturaleza
  cancel-in-progress: false
jobs:
  icono:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Anadir icono respetando el boton existente
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('web/naturaleza-catalogo.js')
          s=p.read_text(encoding='utf-8')
          antiguo="b.textContent='Fauna y flora';"
          html='<span class="bt g" data-bio-icon="huella-hoja" aria-hidden="true" style="width:36px;height:36px;flex:none"><svg xmlns="http://www.w3.org/2000/svg" width="25" height="25" viewBox="0 0 32 32" fill="none" focusable="false"><g fill="currentColor"><ellipse cx="6" cy="13" rx="2.3" ry="3" transform="rotate(-20 6 13)"/><ellipse cx="11" cy="8" rx="2.3" ry="3"/><ellipse cx="17" cy="8" rx="2.3" ry="3"/><ellipse cx="21" cy="13" rx="2.3" ry="3" transform="rotate(20 21 13)"/><path d="M7 23c0-3 2-4 3-6 2-3 6-3 8 0 1 2 3 3 3 6 0 4-4 3-7 2-3 1-7 2-7-2Z"/></g><path d="M20 25c-1-6 2-11 10-12 0 8-3 13-10 12Z" fill="#E5EFE1" stroke="currentColor" stroke-width="1.7"/><path d="m19 28 8-11" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg></span><span>Fauna y flora</span>'
          nuevo='b.innerHTML='+json.dumps(html,ensure_ascii=False)+';'
          if antiguo in s:
              if s.count(antiguo)!=1:
                  raise SystemExit('Hay varios botones coincidentes: no se modifica el catalogo')
              s=s.replace(antiguo,nuevo,1)
          elif 'data-bio-icon' not in s:
              raise SystemExit('No se encuentra el boton esperado: no se modifica el catalogo')
          p.write_text(s,encoding='utf-8')
          PY
          node --check web/naturaleza-catalogo.js
          python3 tools/make_version.py
      - name: Guardar icono
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/naturaleza-catalogo.js web/version.json
          if ! git diff --cached --quiet; then
            git commit -m 'Mostrar icono de huella y hoja en Fauna y flora'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
