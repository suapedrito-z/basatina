# Farmacias y espacios protegidos (tools/servicios.py). Se ejecuta cada mes, cuando cambia tools/servicios.py, o a mano desde la pestaña Actions.
name: Farmacias y espacios protegidos
on:
  push:
    paths: ['tools/servicios.py']
  schedule:
    - cron: '17 5 3 * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  servicios:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Preparar
        run: pip install pyshp pyproj
      - name: Descargar
        run: python3 tools/servicios.py
      - name: Guardar en el repositorio
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          for f in tools/servicios_info.txt web/servicios.js; do [ -f "$f" ] && git add "$f"; done
          git commit -m "Farmacias y espacios protegidos actualizados" || exit 0
          git pull --rebase
          python3 tools/make_version.py
          git add web/version.json
          git commit -m "Nueva versión de la pantalla" || true
          for i in 1 2 3 4 5 6; do
            git push && break
            sleep $((i*15))
            git pull --rebase -X theirs || true
            python3 tools/make_version.py && git add web/version.json && git commit -m "Nueva versión de la pantalla" || true
          done
