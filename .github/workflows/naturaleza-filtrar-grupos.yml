name: Filtrar grupos por Fauna y Flora
on:
  push:
    branches: [main]
    paths: ['.github/workflows/naturaleza-filtrar-grupos.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: instalar-naturaleza
  cancel-in-progress: false
jobs:
  corregir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Actualizar grupos antes de filtrar las fichas
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('web/naturaleza-catalogo.js')
          s=p.read_text(encoding='utf-8')
          antiguo="grupos.replaceChildren(new Option('Todos los grupos',''));\n[...new Set(fichas.map(f=>f.grupo))].sort((a,b)=>a.localeCompare(b,'es')).forEach(g=>grupos.add(new Option(g,g)));"
          nuevo="""function bioActualizarGrupos(){
            const anterior=grupos.value;
            const opciones=[...new Set(fichas.filter(f=>tipo==='Todos'||f.tipo===tipo).map(f=>f.grupo))].sort((a,b)=>a.localeCompare(b,'es'));
            grupos.replaceChildren(new Option('Todos los grupos',''));
            opciones.forEach(g=>grupos.add(new Option(g,g)));
            grupos.value=opciones.includes(anterior)?anterior:'';
          }"""
          ancla="function render(){\n  const q=normal(section.querySelector('#bioBuscar').value)"
          cambio="function render(){\n  bioActualizarGrupos();\n  const q=normal(section.querySelector('#bioBuscar').value)"
          if 'function bioActualizarGrupos(){' not in s:
              if s.count(antiguo)!=1 or s.count(ancla)!=1:
                  raise SystemExit('Estructura inesperada: no se modifica el catalogo')
              s=s.replace(antiguo,nuevo,1).replace(ancla,cambio,1)
              p.write_text(s,encoding='utf-8')
          elif cambio not in s:
              raise SystemExit('Correccion parcial inesperada: se requiere revision')
          PY
          node --check web/naturaleza-catalogo.js
      - name: Probar cambios de tipo y seleccion incompatible
        run: |
          node <<'JS'
          const fs=require('fs'),vm=require('vm'),assert=require('assert');
          const code=fs.readFileSync('web/naturaleza-catalogo.js','utf8');
          const start=code.indexOf('function bioActualizarGrupos(){');
          const end=code.indexOf('\nconst wrap=',start);
          assert(start>=0&&end>start,'No se encuentra la funcion a probar');
          const fn=code.slice(start,end)+'\nbioActualizarGrupos();';
          const fichas=[{tipo:'Fauna',grupo:'Aves'},{tipo:'Fauna',grupo:'Mamíferos'},{tipo:'Flora',grupo:'Árboles'}];
          function probar(tipo,anterior,esperadas,seleccion){
            const grupos={value:anterior,options:[],replaceChildren(x){this.options=[x];this.value=x.value;},add(x){this.options.push(x);}};
            const ctx={tipo,fichas,grupos,Option:function(text,value){this.text=text;this.value=value;}};
            vm.runInNewContext(fn,ctx);
            assert.deepStrictEqual(grupos.options.map(x=>x.value),esperadas);
            assert.strictEqual(grupos.value,seleccion);
          }
          probar('Fauna','Árboles',['','Aves','Mamíferos'],'');
          probar('Flora','Aves',['','Árboles'],'');
          probar('Todos','Aves',['','Árboles','Aves','Mamíferos'],'Aves');
          probar('Fauna','Mamíferos',['','Aves','Mamíferos'],'Mamíferos');
          probar('Flora','',['','Árboles'],'');
          JS
          python3 tools/make_version.py
      - name: Guardar correccion
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/naturaleza-catalogo.js web/version.json
          if ! git diff --cached --quiet; then
            git commit -m 'Filtrar grupos segun Fauna o Flora y limpiar selecciones incompatibles'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
