name: Calendario deportivo
on:
  schedule:
    - cron: '0 6 * * 3'   # miércoles a las 07:00 (España)
  workflow_dispatch:
permissions:
  contents: write
concurrency: deporte
jobs:
  deporte:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/deporte.py
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add deporte/partidos.json
          git commit -m "Deporte navarro: cartelera de pelota actualizada" || exit 0
          git pull --rebase
          python3 tools/make_version.py
          git add web/version.json
          git commit -m "Nueva versión de la pantalla" || true
          for i in 1 2 3 4 5 6; do
            git push && break
            sleep $((i*15))
            git pull --rebase -X theirs || true
            if [ -f tools/make_version.py ]; then python3 tools/make_version.py && git add web/version.json && git commit -m "Nueva versión de la pantalla" || true; fi
          done
