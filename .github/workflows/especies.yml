# Fichas de flora y fauna (tools/especies.py). Se ejecuta cada mes, cuando cambia tools/especies.py, o a mano desde la pestaña Actions.
name: Fichas de flora y fauna
on:
  push:
    paths: ['tools/especies.py']
  schedule:
    - cron: '23 3 9 * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  especies:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Preparar
        run: true
      - name: Descargar
        run: python3 tools/especies.py
      - name: Guardar en el repositorio
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          for f in tools/especies_info.txt tools/especies_cache.json web/especies.js; do [ -f "$f" ] && git add "$f"; done
          git commit -m "Fichas de flora y fauna actualizados" || exit 0
          git pull --rebase
          python3 tools/make_version.py
          git add web/version.json
          git commit -m "Nueva versión de la pantalla" || true
          for i in 1 2 3 4 5 6; do
            git push && break
            sleep $((i*15))
            git pull --rebase -X theirs || true
            python3 tools/make_version.py && git add web/version.json && git commit -m "Nueva versión de la pantalla" || true
          done
