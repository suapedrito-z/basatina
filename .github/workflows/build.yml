# Cada vez que se sube un cambio, GitHub fabrica el APK automáticamente.
# Si el número de versión de la app (versionCode) es nuevo, además lo publica como "Release"
# para que la app pueda descargarlo con el botón «Buscar nueva versión».
name: Construir APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
# una compilación detrás de otra, para que la llave solo se cree una vez
concurrency: construir-apk
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Llave de firma
        # La llave (keystore/arga2.jks) se crea una sola vez, aquí, con la contraseña del secreto
        # KEYSTORE_PASS, y se guarda en el repositorio. Sin esa contraseña no sirve para nada.
        env:
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
        run: |
          if [ -z "$KEYSTORE_PASS" ]; then echo "::error::Falta el secreto KEYSTORE_PASS (Settings → Secrets and variables → Actions)"; exit 1; fi
          git fetch -q origin main && git checkout origin/main -- keystore/ 2>/dev/null || true
          if [ ! -f keystore/arga2.jks ]; then
            keytool -genkeypair -keystore keystore/arga2.jks -storetype PKCS12 -alias arga -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$KEYSTORE_PASS" -keypass "$KEYSTORE_PASS" -dname "CN=La Z Sortzailea, O=Pedrito Control Rio Arga, C=ES"
            git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
            git add keystore/arga2.jks && git commit -m "Llave de firma nueva (protegida con el secreto KEYSTORE_PASS)" && git pull -q --rebase origin main && git push
          fi
      - name: Compilar
        env:
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
        run: gradle assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: ControlRioArga-APK
          path: app/build/outputs/apk/release/*.apk
      - name: Publicar versión nueva
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(grep -oP 'versionCode \K\d+' app/build.gradle)
          cp app/build/outputs/apk/release/app-release.apk PedritoControlRioArga.apk
          if gh release view "v$V" >/dev/null 2>&1; then
            # la versión ya existe: solo añade (o reemplaza) el APK con el nombre bonito
            gh release upload "v$V" PedritoControlRioArga.apk --clobber
          else
            gh release create "v$V" PedritoControlRioArga.apk --title "Versión $V" --notes "APK de Pedrito Control Río Arga" --latest
          fi
