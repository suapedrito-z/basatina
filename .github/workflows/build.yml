# Cada vez que se sube un cambio, GitHub fabrica el APK automáticamente.
# Si el número de versión de la app (versionCode) es nuevo, además lo publica como "Release"
# para que la app pueda descargarlo con el botón «Buscar nueva versión».
name: Construir APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compilar
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: ControlRioArga-APK
          path: app/build/outputs/apk/debug/*.apk
      - name: Publicar versión nueva
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(grep -oP 'versionCode \K\d+' app/build.gradle)
          cp app/build/outputs/apk/debug/app-debug.apk ControlRioArga.apk
          if gh release view "v$V" >/dev/null 2>&1; then
            echo "La versión $V ya estaba publicada"
          else
            gh release create "v$V" ControlRioArga.apk --title "Versión $V" --notes "APK de Pedrito Control Río Arga" --latest
          fi
