# Cada vez que se sube un cambio, GitHub fabrica el APK automáticamente.
# Si el número de versión de la app (versionCode) es nuevo, además lo publica como "Release"
# para que la app pueda descargarlo con el botón «Buscar nueva versión».
name: Construir APK
on:
  push:
    paths: ['app/**', 'build.gradle', 'settings.gradle', 'gradle.properties', '.github/workflows/build.yml']
  workflow_dispatch:
permissions:
  contents: write
# una compilación detrás de otra, para que la llave solo se cree una vez
concurrency: construir-apk
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Llave de firma
        # La llave ya NO está en el repositorio (es público): se guarda en el secreto KEYSTORE_B64
        # (el archivo .jks en base64) y su contraseña en KEYSTORE_PASS. Nunca generar una nueva:
        # con otra llave, los móviles no podrían actualizar la app.
        env:
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_PASS" ] || [ -z "$KEYSTORE_B64" ]; then echo "::error::Faltan los secretos KEYSTORE_PASS / KEYSTORE_B64 (Settings → Secrets and variables → Actions)"; exit 1; fi
          mkdir -p keystore
          echo "$KEYSTORE_B64" | base64 -d > keystore/arga2.jks
      - name: Compilar
        env:
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
        run: gradle assembleRelease bundleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: BasatiNA-APK
          path: app/build/outputs/apk/release/*.apk
      # El paquete para Google Play (.aab): se descarga desde la pestaña Actions → esta ejecución → Artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: BasatiNA-GooglePlay-AAB
          path: app/build/outputs/bundle/release/*.aab
      - name: Publicar versión nueva
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(grep -oP 'versionCode \K\d+' app/build.gradle)
          cp app/build/outputs/apk/release/app-release.apk BasatiNA.apk
          cp BasatiNA.apk PedritoControlRioArga.apk   # el nombre antiguo, para los enlaces que ya se pasaron
          if gh release view "v$V" >/dev/null 2>&1; then
            # la versión ya existe: solo añade (o reemplaza) el APK con el nombre bonito
            gh release upload "v$V" BasatiNA.apk PedritoControlRioArga.apk --clobber
          else
            gh release create "v$V" BasatiNA.apk PedritoControlRioArga.apk --title "BasatiNA · versión $V" --notes "APK de BasatiNA" --latest
          fi
