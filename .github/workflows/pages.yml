# Publica la web basatina.es: la app en versión web en la raíz (web/) y la portada informativa en /portada.html (docs/)
name: Publicar web
on:
  push:
    branches: [main]
    paths: ['docs/**', 'web/**', '.github/workflows/pages.yml']
  workflow_run:
    workflows: ['Árboles singulares', 'Datos de caza', 'Energía', 'Tramos de pesca', 'Dibujo de los ríos', 'Viaje (gasolineras, recarga, puertos)', 'Agenda de fiestas', 'Salir al monte', 'Pueblos', 'Terremotos y fallas']
    types: [completed]
  schedule:
    - cron: '41 */3 * * *'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.dep.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Montar la web
        run: |
          # basatina.es abre directamente la app en versión web; la portada informativa queda en /portada.html
          mkdir -p _site
          cp -r docs/. _site/
          mv _site/index.html _site/portada.html
          mv _site/arbustos.js _site/portada-arbustos.js
          sed -i 's#<script src="arbustos.js">#<script src="portada-arbustos.js">#' _site/portada.html
          cp -r web/. _site/
          # enlaces antiguos: /app/ y /probar-7q4m/ llevan a la raíz
          for d in app probar-7q4m; do mkdir -p _site/$d; printf '<!DOCTYPE html><meta charset="utf-8"><meta http-equiv="refresh" content="0; url=/"><link rel="canonical" href="/">' > _site/$d/index.html; done
          touch _site/.nojekyll
          ls _site | head -80
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: dep
        uses: actions/deploy-pages@v4
