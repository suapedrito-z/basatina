name: Energía (descubrir)
on:
  push:
    paths: ['tools/energia_descubrir.py']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  descubrir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probar fuentes
        run: python3 tools/energia_descubrir.py
      - name: Guardar
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add tools/energia_info.txt
          git commit -m "Energía: prueba de fuentes" || exit 0
          git pull --rebase
          git push
