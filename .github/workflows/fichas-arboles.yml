name: Instalar fichas de arboles
on:
  push:
    branches: [main]
    paths: ['web/fichas-arboles.js', '.github/workflows/fichas-arboles.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: instalar-naturaleza
  cancel-in-progress: false
jobs:
  instalar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Validar e instalar acceso independiente
        run: |
          node --check web/fichas-arboles.js
          python3 - <<'PY'
          from pathlib import Path
          p = Path('web/index.html')
          s = p.read_text(encoding='utf-8')
          tag = '<script src="fichas-arboles.js"></script>'
          if tag not in s:
              if '</body>' not in s:
                  raise SystemExit('No se encuentra el cierre body; no se modifica index.html')
              p.write_text(s.replace('</body>', tag + '\n</body>', 1), encoding='utf-8')
          PY
          python3 tools/make_version.py
      - name: Guardar integracion
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/index.html web/version.json
          if ! git diff --cached --quiet; then
            git commit -m 'Integrar acceso independiente Fichas de árboles'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
