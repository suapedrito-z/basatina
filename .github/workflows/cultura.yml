name: Agenda cultural
on:
  schedule:
    - cron: '30 5 * * *'   # cada día a las 06:30 (España)
  workflow_dispatch:
permissions:
  contents: write
concurrency: cultura
jobs:
  cultura:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/cultura.py
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add agenda/cultura.json
          git commit -m "Agenda cultural actualizada (Cultura Navarra y Ayuntamiento de Pamplona)" || exit 0
          for i in 1 2 3 4 5 6; do
            git pull --rebase -X theirs || true
            git push && break
            sleep $((i*15))
          done
