name: Vídeo de presentación
on:
  push:
    paths: ['tools/video.py']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  video:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Preparar
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-noto-color-emoji
          pip install playwright && python3 -m playwright install --with-deps chromium
      - name: Grabar
        run: |
          (cd web && python3 -m http.server 8765 >/dev/null 2>&1 &)
          sleep 2
          python3 tools/video.py http://localhost:8765/
      - name: Guardar en la rama «video» (aparte, para no engordar la app)
        run: |
          mkdir /tmp/v && cp BasatiNA_presentacion.mp4 /tmp/v/ && cd /tmp/v
          git init -q -b video && git config user.name "github-actions" && git config user.email "github-actions@users.noreply.github.com"
          git add . && git commit -qm "Vídeo de presentación"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" video
