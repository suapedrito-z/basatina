name: Verificar fichas de flora
on:
  push:
    paths: ['tools/fichas_plantas/**', 'web/fichas-plantas-datos.js', 'web/flora-inventario-datos.js']
  workflow_dispatch:
jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Comprobar fichas e inventario
        run: python3 tools/fichas_plantas/build.py --check
      - name: Comprobar que el archivo de la app está al día
        run: |
          python3 tools/fichas_plantas/build.py
          git diff --exit-code web/fichas-plantas-datos.js
