# Ríos «ahora» para la versión web (basatina.es/app): lee el SAIH Ebro cada 20 minutos
# y guarda rios-ahora.json en la rama «datos» (siempre un solo commit, para no llenar el historial).
name: Ríos ahora (web)
on:
  schedule:
    - cron: '7,27,47 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: rios-ahora
  cancel-in-progress: false
jobs:
  rios:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Recuperar la lista de estaciones guardada
        run: |
          git fetch --depth=1 origin datos 2>/dev/null && git show origin/datos:rios-estaciones.json > rios-estaciones.json 2>/dev/null || true
      - name: Probar la conexión con el SAIH
        run: |
          curl -sS -m 20 -o /tmp/b.json -w "getBusquedas: %{http_code} %{size_download} bytes %{time_total}s\n" -A "BasatiNA/1.0 (+https://basatina.es)" https://www.saihebro.com/api/common/getBusquedas || echo "sin respuesta"
          curl -sS -m 20 -o /dev/null -w "ficha A313: %{http_code} %{size_download} bytes %{time_total}s\n" -A "BasatiNA/1.0 (+https://basatina.es)" "https://www.saihebro.com/api/ficha/procesarTablaValoresActuales?estacion=A313" || echo "sin respuesta"
      - name: Leer el SAIH
        run: python3 -u tools/rios_ahora.py
      - name: Guardar en la rama datos
        run: |
          mkdir -p /tmp/datos && cp rios-ahora.json /tmp/datos/ && cp rios-estaciones.json /tmp/datos/ 2>/dev/null || true
          cd /tmp/datos
          git init -q -b datos
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Ríos ahora $(date -u +%H:%M)"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" datos
