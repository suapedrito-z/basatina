:root{--bg:#0d151d;--panel:#16212c;--line:#283848;--txt:#e9f1f7;--mut:#9fb0c0;--acc:#29c6f2;--acc2:#ff8a3d;--acc3:#2f7de1}

*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--txt);line-height:1.5}
a{color:var(--acc)}
.wrap{max-width:980px;margin:0 auto;padding:0 18px}
header{padding:28px 0 8px;display:flex;align-items:center;gap:14px}
header img{width:58px;height:58px;border-radius:14px}
header b{font-size:24px;letter-spacing:.01em}
header span{display:block;color:var(--mut);font-size:14px}
.hero{padding:26px 0 30px;display:grid;grid-template-columns:1.2fr 1fr;gap:28px;align-items:center}
.hero h1{font-size:clamp(28px,5vw,46px);line-height:1.1;margin:0 0 14px}
.hero h1 em{font-style:normal;background:linear-gradient(90deg,var(--acc3),var(--acc) 60%,var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--mut);font-size:17px;margin:0 0 22px}
.dl{display:inline-flex;align-items:center;gap:10px;background:linear-gradient(135deg,var(--acc3),var(--acc));color:#fff;text-decoration:none;font-weight:700;font-size:18px;padding:14px 22px;border-radius:14px;box-shadow:0 8px 24px rgba(41,198,242,.25)}
.dl.alt{background:transparent;border:2px solid var(--acc);box-shadow:none;color:var(--acc);font-size:16px;padding:11px 18px}
.small{color:var(--mut);font-size:13px;margin-top:10px}
.hero .logo{width:100%;max-width:420px;justify-self:center;background:#fff;padding:18px;border-radius:18px;box-shadow:0 10px 40px rgba(0,0,0,.45)}
h2{font-size:24px;margin:34px 0 14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.f{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px}
.f i{font-style:normal;font-size:28px;display:block;margin-bottom:6px}
.f b{display:block;margin-bottom:4px}
.f p{margin:0;color:var(--mut);font-size:14px}
.steps{counter-reset:s;display:grid;gap:10px}
.steps div{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px 12px 52px;position:relative}
.steps div:before{counter-increment:s;content:counter(s);position:absolute;left:14px;top:12px;width:26px;height:26px;border-radius:50%;background:var(--acc);color:#04121f;font-weight:800;display:flex;align-items:center;justify-content:center}
.aviso{margin:34px 0 0;border:1px solid #ffb020;background:rgba(255,176,32,.08);border-radius:14px;padding:14px;font-size:15px}
footer{margin:40px 0 0;padding:24px 0 40px;border-top:1px solid var(--line);color:var(--mut);font-size:14px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
footer img{width:120px;border-radius:10px}

.cred{padding-left:18px;line-height:1.5}.cred li{margin:4px 0;font-size:.95em}
.news{display:grid;gap:12px}
.n{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;display:grid;grid-template-columns:1fr;gap:12px}
.n.ft{grid-template-columns:160px 1fr}.n img{width:100%;border-radius:12px;object-fit:cover;max-height:160px}
.n small{color:var(--mut)}.n b{display:block;font-size:17px;margin:2px 0 4px}.n p{margin:0;color:var(--mut)}

@media(max-width:760px){.n.ft,.ap.ft{grid-template-columns:1fr}}

<script>
// La web se dibuja a partir de contenido.json (lo que se edita desde /admin).
const esc=t=>String(t??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const md=t=>esc(t).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\*(.+?)\*/g,'<em>$1</em>').replace(/(https?:\/\/[^\s<]+)/g,'<a href="$1">$1</a>').replace(/\n/g,'<br>');
const fd=d=>{try{return new Date(d+'T12:00').toLocaleDateString('es-ES',{day:'numeric',month:'long',year:'numeric'})}catch(e){return d}};
function draw(c){
 const sa=document.getElementById('seccion-arbustos');if(sa)document.body.appendChild(sa);   // se saca antes de redibujar
 const k=c.colores||{},r=document.documentElement.style;
 [['fondo','--bg'],['tarjeta','--panel'],['borde','--line'],['texto','--txt'],['suave','--mut'],['principal','--acc'],['naranja','--acc2'],['azul','--acc3']].forEach(([a,b])=>k[a]&&r.setProperty(b,k[a]));
 const m=c.marca||{},p=c.portada||{};let h='';
 if(location.search.includes('preview'))h+='<div id="prev">👁️ VISTA PREVIA — todavía no está publicado</div>';
 h+=`<header><img src="${esc(m.icono)}" alt=""><div><b>${esc(m.nombre)}</b><span>${esc(m.lema)}</span></div></header>`;
 h+=`<section class="hero"><div><h1>${md(p.titulo)}</h1><p>${md(p.texto)}</p>${p.pausada?`<span class="dl" style="opacity:.55;cursor:default">📱 Muy pronto para Android</span><div class="small">Estamos dando los últimos retoques. ¡Vuelve pronto!</div>`:`<a class="dl" href="${esc(p.enlace)}">${esc(p.boton)}</a><div class="small">${md(p.nota)}</div>`}${c.app_web&&c.app_web.visible?`<div style="margin-top:12px"><a class="dl alt" href="app/">${esc(c.app_web.boton)}</a><div class="small">${md(c.app_web.nota)}</div></div>`:''}</div>${m.logo?`<img class="logo" src="${esc(m.logo)}" alt="${esc(m.empresa)}">`:''}</section>`;
 const nv=(c.novedades||[]).filter(n=>n.titulo||n.texto);
 if(nv.length){h+='<h2 id="novedades">Novedades</h2><div class="news">'+nv.map(n=>`<div class="n${n.foto?' ft':''}">${n.foto?`<img src="${esc(n.foto)}" alt="">`:''}<div><small>${esc(fd(n.fecha))}</small><b>${esc(n.titulo)}</b><p>${md(n.texto)}</p></div></div>`).join('')+'</div>';}
 h+=`<h2>${esc(c.funciones_titulo)}</h2><div class="grid">`+(c.funciones||[]).map(f=>`<div class="f"><i>${esc(f.icono)}</i><b>${esc(f.titulo)}</b><p>${md(f.texto)}</p></div>`).join('')+'</div>';
 (c.apartados||[]).filter(a=>a.titulo||a.texto).forEach(a=>{h+=`<h2>${esc(a.titulo)}</h2><div class="ap${a.foto?' ft':''}"><div><p>${md(a.texto)}</p></div>${a.foto?`<img src="${esc(a.foto)}" alt="">`:''}</div>`;});
 if(!p.pausada)h+=`<h2>${esc(c.pasos_titulo)}</h2><div class="steps">`+(c.pasos||[]).map(s=>`<div>${md(s)}</div>`).join('')+'</div>';
 h+='<div id="arbHost" style="margin-top:34px"></div>';
 h+='<h2 id="fuentes">Fuentes y créditos</h2><ul class="cred">'+(c.fuentes||[]).map(f=>`<li><b>${esc(f.tema)}:</b> ${md(f.texto)}</li>`).join('')+`</ul><p class="small">${md(c.fuentes_nota)}</p>`;
 h+=`<h2 id="privacidad">Privacidad</h2><p class="small">${md(c.privacidad)}</p>`;
 if(c.contacto)h+=`<h2 id="contacto">Contacto</h2><p>${md(c.contacto)}</p>`;
 h+=`<div class="aviso">${md(c.aviso)}</div>`;
 h+=`<footer>${m.logo_empresa?`<img src="${esc(m.logo_empresa)}" alt="">`:''}<div>${md(c.pie)}</div></footer>`;
 document.getElementById('app').innerHTML=h;
 {const ah=document.getElementById('arbHost'),sb=document.getElementById('seccion-arbustos');if(ah&&sb)ah.appendChild(sb);}
 naRojo(document.getElementById('app'));document.title=(m.nombre||'BasatiNA')+' · '+(m.lema||'');
}
// «BasatiNA» siempre con la «NA» en rojo, como en el logo (solo en el texto, nunca en enlaces ni atributos)
function naRojo(root){const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT),L=[];let n;while((n=w.nextNode()))if(n.nodeValue.includes('BasatiNA'))L.push(n);
 L.forEach(n=>{const f=document.createDocumentFragment();n.nodeValue.split('BasatiNA').forEach((t,i,a)=>{if(t)f.appendChild(document.createTextNode(t));if(i<a.length-1){f.appendChild(document.createTextNode('Basati'));const s=document.createElement('span');s.style.cssText='color:#DD4826;display:inline;font-size:inherit;margin:0';s.textContent='NA';f.appendChild(s);}});n.parentNode.replaceChild(f,n);});}
let C=JSON.parse(document.getElementById('def').textContent);
if(location.search.includes('preview')){try{const x=JSON.parse(localStorage.getItem('sp_preview'));if(x)C=x;}catch(e){}draw(C);}
else{draw(C);fetch('contenido.json?t='+Date.now()).then(r=>r.json()).then(x=>{C=x;draw(C);}).catch(()=>{});}
</script>
